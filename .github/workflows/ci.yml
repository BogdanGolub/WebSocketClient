name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS · swift test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  linux:
    name: Linux · swift test
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
